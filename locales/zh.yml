about:
  content: >
    # 关于 IT-Tools

    IT-Tools 由 [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) 用 ❤ 打造，汇集了对开发人员和 IT 从业者实用的在线工具。如果它对你有帮助，欢迎分享给身边的朋友，并添加到浏览器收藏夹！

    IT-Tools 永久免费且开源（GPL-3.0 许可证），但托管和域名续费需要成本。如果你想支持作者的工作、鼓励添加更多工具，欢迎考虑[赞助](https://www.buymeacoffee.com/cthmsst)。

    ## 技术栈

    IT-Tools 基于 Vue.js（Vue 3）和 Naive UI 组件库开发，由 Vercel 托管并持续部署。部分工具使用了第三方开源库，完整列表见仓库的 [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) 文件。

    ## 发现了 Bug？缺少想要的工具？

    如果你需要的工具目前还没有，且觉得它对其他人也有用，欢迎在 GitHub 仓库的 [issues](https://github.com/CorentinTh/it-tools/issues/new/choose) 中提交功能请求。

    如果你发现了 Bug，或某个功能不符合预期，也请在 [issues](https://github.com/CorentinTh/it-tools/issues/new/choose) 中提交错误报告。

